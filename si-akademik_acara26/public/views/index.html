<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Mahasiswa - Sistem Informasi Akademik</title>
  <style>
    :root { --bg:#f5f7fa; --card:#fff; --text:#1d2433; --muted:#5b6475; --line:#d9dee8; --accent:#1f5fbf; --head:#eaf0fa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14181f; --card:#1c222c; --text:#e8ecf3; --muted:#9aa5b8; --line:#2d3646; --accent:#6ea2ff; --head:#232c3a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 820px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.25rem; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .bar { display:flex; justify-content: space-between; align-items:center; padding:.75rem 1rem; border-bottom:1px solid var(--line); }
    button { font: inherit; padding:.4rem .9rem; border-radius:6px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
    button:hover { background: var(--accent); color: var(--card); }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding:.65rem 1rem; border-bottom:1px solid var(--line); }
    th { background: var(--head); font-size:.85rem; text-transform: uppercase; letter-spacing:.03em; }
    tbody tr:last-child td { border-bottom: none; }
    a { color: var(--accent); margin-right:.5rem; }
    .status { padding: 1rem; text-align:center; color: var(--muted); }
    .status.galat { color: #c0392b; }
    @media (prefers-color-scheme: dark) { .status.galat { color:#ff8a7a; } }
  </style>
</head>
<body>
  <main>
    <h1>Data Mahasiswa</h1>
    <p class="sub">Data diambil dari API <code>GET /mahasiswa</code> menggunakan Fetch API.</p>
    <section class="card">
      <div class="bar">
        <strong>Daftar Mahasiswa</strong>
        <span><a href="login.html">Login admin</a> <button type="button" id="tombol-muat">Muat ulang</button></span>
      </div>
      <table id="tabel-mahasiswa">
        <thead><tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
