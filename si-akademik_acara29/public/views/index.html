<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Mahasiswa - Sistem Informasi Akademik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Data Mahasiswa</h1>
    <p class="sub">Data diambil dari API <code>GET /mahasiswa</code> menggunakan Fetch API.</p>
    <section class="card">
      <div class="bar">
        <strong>Daftar Mahasiswa</strong>
        <span><a href="login.html" class="tombol sekunder">Login admin</a> <button type="button" id="tombol-muat">Muat ulang</button></span>
      </div>
      <table id="tabel-mahasiswa">
        <thead><tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
